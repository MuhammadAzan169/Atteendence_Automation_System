server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow /dashboard as well as /dashboard.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # In docker-compose the API lives in a sibling container; proxying it here
    # means the frontend can call same-origin /api paths with no CORS setup.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
