<!DOCTYPE html>
<html>

<head>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <title>GPS Verification</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-card">

<h1>Attendance Automation System</h1>

<h2>GPS Verification</h2>

<p>Click the button below to verify your location.</p>

<button onclick="getLocation()">Verify Location</button>

<p id="locationStatus"></p>

<script>

function getLocation(){

    if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition(success,error);

    }else{

        document.getElementById("locationStatus").innerHTML="Geolocation is not supported.";

    }

}

function success(position){

    document.getElementById("locationStatus").innerHTML="✅ Location Verified Successfully";

}

function error(){

    document.getElementById("locationStatus").innerHTML="❌ Location Access Denied";

}

</script>

<br><br>

<a href="{{ url_for('camera_verification') }}">
<button>Next</button>
</a>

</div>

</body>

</html>
